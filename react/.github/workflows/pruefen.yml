name: Prüfung

# Prüft bei jeder Änderung, dass alle Musterlösungen den Prüfer bestehen.
# Damit ist sichergestellt, dass Aufgaben, Lösungen und Prüfungen
# zusammenpassen.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  musterloesungen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Abhängigkeiten
        run: npm ci
      - name: Musterlösungen prüfen
        run: ./pruefen.sh --loesung
