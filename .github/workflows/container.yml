name: Container

# Prüft bei jeder Änderung, dass alle Musterlösungen den Prüfer bestehen.
# Damit ist sichergestellt, dass Aufgaben, Lösungen und Prüfungen
# zusammenpassen.

on:
  push:
    branches: [main]
    paths: ['container/**', '.github/workflows/container.yml']
  pull_request:
    paths: ['container/**', '.github/workflows/container.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: container

jobs:
  musterloesungen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Musterlösungen prüfen
        run: ./pruefen.sh --loesung
