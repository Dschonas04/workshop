name: Go

# Prüft bei jeder Änderung, dass alle Musterlösungen den Prüfer bestehen.
# Damit ist sichergestellt, dass Aufgaben, Lösungen und Prüfungen
# zusammenpassen.

on:
  push:
    branches: [main]
    paths: ['go/**', '.github/workflows/go.yml']
  pull_request:
    paths: ['go/**', '.github/workflows/go.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: go

jobs:
  musterloesungen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
      - name: Musterlösungen prüfen
        run: ./pruefen.sh --loesung
