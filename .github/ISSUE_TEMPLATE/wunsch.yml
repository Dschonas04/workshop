name: Wunsch oder Idee
description: Neues Thema, neue Aufgabe, bessere Erklärung
labels: [wunsch]
body:
  - type: dropdown
    id: workshop
    attributes:
      label: Workshop
      options: [Ansible, Container, Go, PowerShell, React, Shell, Terraform]
    validations:
      required: true
  - type: textarea
    id: idee
    attributes:
      label: Was fehlt dir?
    validations:
      required: true
  - type: textarea
    id: warum
    attributes:
      label: Wofür brauchst du es?
