services:

  api:
    build: ./api
    environment:
      GRUSS: moin
    volumes:
      - gemeinsam:/gemeinsam

  pruefer:
    image: alpine:3.20
    depends_on:
      - api
    volumes:
      - gemeinsam:/gemeinsam
    command: >
      sh -c "sleep 3; cat /gemeinsam/api.log"

volumes:
  gemeinsam:
