name: Prüfung

# Prüft bei jeder Änderung, dass alle Musterlösungen den Prüfer bestehen.
# Damit ist sichergestellt, dass Aufgaben, Lösungen und Prüfungen
# zusammenpassen.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  musterloesungen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Musterlösungen prüfen
        run: ./pruefen.sh --loesung
