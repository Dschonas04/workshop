---
# Musterlösung der Rollen-Tasks (Level 4).
- name: Verzeichnis der Rolle
  ansible.builtin.file:
    path: "{{ workshopdienst_ordner }}"
    state: directory
    mode: "0755"

- name: Konfiguration schreiben
  ansible.builtin.template:
    src: dienst.conf.j2
    dest: "{{ workshopdienst_ordner }}/dienst.conf"
    mode: "0644"
  notify: Dienst neu starten

- name: Namen festhalten
  ansible.builtin.copy:
    dest: "{{ workshopdienst_ordner }}/name.txt"
    content: "{{ workshopdienst_name }}\n"
    mode: "0644"
